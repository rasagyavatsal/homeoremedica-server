name: Deploy

# Deploys the API to Cloud Run, then the web app to Firebase Hosting, in one project.
# Release Please calls it for prod, Deploy dev for dev. Run it by hand to redeploy prod.
on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      workload_identity_provider:
        type: string
        required: true
      service_account:
        type: string
        required: true
      api_origin:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      project:
        type: string
        default: homeoremedica
      workload_identity_provider:
        type: string
        default: projects/619837289655/locations/global/workloadIdentityPools/github/providers/github
      service_account:
        type: string
        default: github-deployer@homeoremedica.iam.gserviceaccount.com
      api_origin:
        type: string
        default: https://homeoremedica-619837289655.asia-south1.run.app

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.project }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          VITE_API_ORIGIN: ${{ inputs.api_origin }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: npm run deploy -- --quiet
        env:
          GCP_PROJECT: ${{ inputs.project }}
      - run: npx --yes firebase-tools@15.32.1 deploy --only hosting --project "$GCP_PROJECT" --non-interactive
        env:
          GCP_PROJECT: ${{ inputs.project }}
